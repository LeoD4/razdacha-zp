<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Раздача ЗП</title>
<style>
:root{--bg:#f2f6ec;--card:#fff;--bd:#d5dfc8;--tx:#17231a;--mut:#6a776c;--ac:#4a7a00;--acbg:#e3f0c8;--acfg:#fff;--nav:#fff;--in:#f2f6ec;--warn:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1511;--card:#131e19;--bd:#1f2f27;--tx:#e6efe8;--mut:#7f8d84;--ac:#c4e060;--acbg:#2b3a1b;--acfg:#11200a;--nav:#121d18;--in:#0f1914;--warn:#ff9a8a}}
:root[data-theme="dark"]{--bg:#0c1511;--card:#131e19;--bd:#1f2f27;--tx:#e6efe8;--mut:#7f8d84;--ac:#c4e060;--acbg:#2b3a1b;--acfg:#11200a;--nav:#121d18;--in:#0f1914;--warn:#ff9a8a}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0 auto;color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:600px;padding:14px 12px 120px}
h1{margin:6px 6px 14px;font-size:34px;font-weight:800;color:var(--ac);letter-spacing:.5px}
h1 small{font-size:16px;font-weight:400;color:var(--mut);margin-left:8px}
.lbl{margin:18px 10px 8px;font-size:14px;letter-spacing:2px;color:var(--mut);font-weight:600}
.card{background:var(--card);border:2px solid var(--bd);border-radius:26px;padding:14px 16px;margin:10px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--mut)}
input{width:100%;margin-top:4px;font:600 18px ui-monospace,Menlo,Consolas,monospace;padding:10px 12px;border:2px solid var(--bd);border-radius:16px;background:var(--in);color:var(--tx);outline:none}
input:focus{border-color:var(--ac)}
.pr{display:flex;align-items:center;gap:10px;padding:10px 12px}
.pr .n{flex:1;font-size:20px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pr input{width:132px;margin:0;text-align:right}
.rub{color:var(--mut);margin-left:-4px}
.x{flex:none;min-width:40px;height:40px;padding:0 10px;border-radius:20px;border:0;background:var(--in);color:var(--mut);font:700 14px system-ui,sans-serif}
.pill{display:inline-block;padding:12px 18px;border-radius:18px;border:0;background:var(--acbg);color:var(--ac);font:700 15px system-ui,sans-serif}
.pill.g2{background:var(--card);border:2px solid var(--bd);color:var(--mut)}
.chip{padding:10px 14px;border-radius:18px;border:2px solid var(--bd);background:var(--in);color:var(--mut);font:700 16px system-ui,sans-serif}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--acfg)}
select{font:700 16px system-ui,sans-serif;padding:8px;border:2px solid var(--bd);border-radius:12px;background:var(--in);color:var(--tx)}
.pr input::placeholder{color:var(--tx);opacity:.5}
.sg{display:grid;grid-template-columns:1fr 1fr 1.4fr 1.4fr auto;gap:8px;align-items:end}
.sg label{min-width:0}
.sg input{min-width:0;padding:10px 8px}
.sg .x{margin-bottom:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin:6px 0 4px}
.stats b{display:block;font:700 18px ui-monospace,Menlo,Consolas,monospace}
.stats span{font-size:12px;color:var(--mut)}
.ring{display:block;margin:8px auto 4px;width:190px;height:190px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:5px 6px}
th{font-size:13px;color:var(--mut);font-weight:600;padding:2px 0}
td{padding:0;text-align:center;font-size:20px}
td.nm{text-align:left;padding:2px 2px;font-weight:700;font-size:17px;cursor:pointer}
td.nm small{display:block;font-weight:400;color:var(--mut);font-size:12px}
td.z{color:var(--mut)}
td.cl{font-weight:800;height:52px;min-width:42px;cursor:pointer;border:2px solid var(--bd);border-radius:14px;background:var(--in);font-size:22px}
td.cl.d{background:var(--ac);border-color:var(--ac);color:var(--acfg)}
td.sm{text-align:right;font:600 13px ui-monospace,Menlo,Consolas,monospace;white-space:nowrap;color:var(--mut)}
td.sm.ok{color:var(--ac);font-weight:800}
tr.f td{font-weight:800;font-size:16px;height:34px;border-top:2px solid var(--bd)}
tr.f td:first-child{text-align:left;font-size:12px;color:var(--mut)}
.s p{margin:0;padding:10px 0;border-bottom:1px solid var(--bd)}
.s p:last-child{border-bottom:0}
.r2{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.r2:last-child{border-bottom:0}
.w{color:var(--warn);font-weight:700}
.ok2{color:var(--ac);font-weight:700}
.mut{color:var(--mut);font-size:13px}
table.rt{border-spacing:0}
.rt th,.rt td{font:600 14px ui-monospace,Menlo,Consolas,monospace;padding:7px 6px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap;height:auto}
.rt th{font:600 12px system-ui,sans-serif;color:var(--mut)}
.rt th:first-child,.rt td:first-child{text-align:left;font-family:system-ui,sans-serif;font-weight:700}
.rt tr.t td{font-weight:800;border-bottom:0}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:576px;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:6px;background:var(--nav);border:2px solid var(--bd);border-radius:32px;z-index:9}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;border:2px solid transparent;border-radius:26px;background:none;color:var(--mut);font:600 13px system-ui,sans-serif}
nav button.on{background:var(--acbg);border-color:var(--bd);color:var(--ac)}
nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div id="app"></div>
<script>
var KEY="zpcfg4",D=[5000,1000,500,200,100];
var DEF={bank:"",n1:"",n05:"",sw:"",brig:"",tab:"people",ticks:{},sig:"",people:[["Саня",""],["Даня",""],["Ваня",""],["Эля",""],["Эльнур",""],["Витя",""],["Егор",""],["Костя",""],["Аня",""],["Тёма",""],["Женя",""],["Гор",""]].map(function(p){return{n:p[0],a:p[1]}})};
var C=JSON.parse(JSON.stringify(DEF)),armed="";
try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.people)C=o}}catch(e){}
var REF=null,CLOUD="☁ подключаюсь…",pushT=null,pushing=false,dirty=false;
function setCloud(t){CLOUD=t;var e=document.getElementById("cloud");if(e)e.textContent=t}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(C))}catch(e){}}
function save(){C.ts=Date.now();saveLocal();schedPush()}
function schedPush(){if(!REF)return;setCloud("☁ сохраняю…");clearTimeout(pushT);pushT=setTimeout(doPush,900)}
function doPush(){if(!REF)return;if(pushing){dirty=true;return}pushing=true;C.ts=C.ts||Date.now();var snap=JSON.parse(JSON.stringify(C));
REF.set(snap).then(function(){setCloud("☁ сохранено в облаке")}).catch(function(e){setCloud("☁ не удалось сохранить"+(e&&e.code?" ("+e.code+")":""))}).then(function(){pushing=false;if(dirty){dirty=false;doPush()}})}
function initCloud(){
if(!window.claude||!window.claude.use){ROLE="owner";setCloud("☁ облака нет, данные только на этом телефоне");render();return}
Promise.all([claude.use("db"),claude.use("user")]).then(function(r){var db=r[0],user=r[1];
if(!db||!user){ROLE="login";render();return}
DBH=db;
return user.isOwner().then(function(own){
if(!own){ROLE="emp";render();subReports();return}
ROLE="owner";render();
return user.id().then(function(uid){
if(!uid){setCloud("☁ войдите в аккаунт, чтобы данные сохранялись в облаке");return}
REF=db.doc("data/users/"+uid+"/state");var first=true;
REF.onSnapshot(function(s){var d=s.exists?s.data():null;
if(d&&d.people&&(d.ts||0)>(C.ts||0)){C=JSON.parse(JSON.stringify(d));saveLocal();var ae=document.activeElement;if(!(ae&&ae.tagName==="INPUT"))render()}
else if(first&&(!d||(C.ts||0)>(d.ts||0)))schedPush();
if(first){first=false;if(!pushT)setCloud("☁ подключено")}},
function(e){setCloud("☁ ошибка облака"+(e&&e.code?" ("+e.code+")":""))})})})}).catch(function(){ROLE="login";render()})}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ")}
function lab(d){return d===5000?"5к":d===1000?"1к":String(d)}
function pa(s){s=String(s).replace(/\s/g,"");if(/^\d{1,3}([.,]\d{3})+$/.test(s))return +s.replace(/[.,]/g,"");if(/^\d+([.,]\d{1,2})?$/.test(s))return Math.round(parseFloat(s.replace(",",".")));return NaN}
function nm(v){v=String(v==null?"":v).trim();if(!v)return 0;var x=pa(v);return isNaN(x)?0:x}
function txt(c){var p=[];D.forEach(function(d){if(c[d])p.push(c[d]+"×"+lab(d))});return p.join(" + ")||"0"}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function calc(){
var W=[],E=[];
C.people.forEach(function(p){var s=amtOf(p);if(!s)return;var a=pa(s);if(isNaN(a))E.push("Сумма не понята: "+p.n+" «"+s+"»");else W.push({n:p.n,raw:a,A:Math.floor(a/100)*100})});
var bank=bankAuto(),n1=nm(C.n1),n05=nm(C.n05),sw=Math.max(0,Math.floor(nm(C.sw)));
var rest5=bank-1000*n1-500*n05,n5=Math.max(0,Math.floor(rest5/5000));
if(bank&&(rest5<0||rest5%5000))E.push("Банк не раскладывается: после 1к и 500 остаётся "+fmt(rest5)+" ₽, это должно делиться на 5 000.");
if(sw>n5){E.push("Обмен больше, чем 5к в банке. Взял "+n5+".");sw=n5}
var st={5000:n5-sw,1000:n1+5*sw,500:n05};
var L={5000:st[5000],1000:st[1000],500:st[500]},unmet=0;
W.forEach(function(w){w.c={5000:0,1000:0,500:0,200:0,100:0};var k=Math.min(Math.floor(w.A/5000),L[5000]);w.c[5000]=k;L[5000]-=k;w.r=w.A-5000*k});
W.slice().sort(function(a,b){return b.r-a.r}).forEach(function(w){var r=w.r,need=Math.floor(r/1000),k=Math.min(need,L[1000]);unmet+=need-k;w.c[1000]=k;L[1000]-=k;r-=1000*k;
if(r%200===100&&r>=500&&L[500]>0){w.c[500]++;L[500]--;r-=500}
while(r>=1000&&L[500]>=2){w.c[500]+=2;L[500]-=2;r-=1000}
w.c[200]=Math.floor(r/200);r-=200*w.c[200];w.c[100]=r/100});
var T={5000:0,1000:0,500:0,200:0,100:0},S=0,RAW=0;
W.forEach(function(w){D.forEach(function(d){T[d]+=w.c[d]});S+=w.A;RAW+=w.raw});
var M=200*T[200]+100*T[100],rest=bank-S;
var B=String(C.brig||"").trim()!==""?nm(C.brig):Math.floor(Math.max(rest,0)/1000)*1000;
return{W:W,E:E,bank:bank,sw:sw,st:st,L:L,T:T,S:S,RAW:RAW,M:M,rest:rest,B:B,Cm:rest-B,unmet:unmet,n5:n5}}
function split(L,B){var best=null;for(var a=0;a<=L[5000];a++)for(var b=0;b<=L[1000];b++)for(var c=0;c<=L[500];c++){if(5000*a+1000*b+500*c===B){var n=a+b+c;if(!best||n<best.n)best={n:n,a:a,b:b,c:c}}}return best}
var IC={shift:'<svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4.5h6M9 12l2 2 4-4M9 17h6"/></svg>',people:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.6 0 4.5 2 4.5 5"/></svg>',tab:'<svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>',rep:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M7.5 14h3M13.5 14h3M7.5 17h3"/></svg>',sum:'<svg viewBox="0 0 24 24"><path d="M5 4h14M5 10h14M5 16h9"/><path d="M15 19.5l2.2 2L21 17.5"/></svg>'};
function nav(){return'<nav>'+[["shift","Смена"],["people","Люди"],["tab","Раздача"],["sum","Итог"],["rep","Отчёт"]].map(function(t){return'<button data-t="'+t[0]+'" class="'+(C.tab===t[0]?"on":"")+'">'+IC[t[0]]+t[1]+"</button>"}).join("")+"</nav>"}
var ROLE=(window.claude&&window.claude.use)?null:"owner",DBH=null,REPS=[],EMPLOADED=false,EMPERR="",NOTE2="";
function render(){
var a=document.getElementById("app");
if(ROLE===null){a.innerHTML='<h1>РАЗДАЧА ЗП</h1><div class="card"><p class="mut" style="margin:0">Загрузка…</p></div>';return}
if(ROLE==="login"){a.innerHTML='<h1>РАЗДАЧА ЗП</h1><div class="card"><p style="margin:0 0 12px">Чтобы увидеть отчёт, войдите в свой аккаунт Claude и откройте ссылку ещё раз.</p><button class="pill g2" id="loc">Открыть без облака</button></div>';var l=document.getElementById("loc");if(l)l.onclick=function(){ROLE="owner";render()};return}
if(ROLE==="emp"){renderEmp();return}
renderOwner()}
function getMe(){try{return localStorage.getItem("zpme")||""}catch(e){return""}}
function setMe(v){try{localStorage.setItem("zpme",v)}catch(e){}}
function subReports(){if(!DBH)return;
DBH.collection("reports").orderBy("ts","desc").limit(12).onSnapshot(function(s){REPS=s.docs.map(function(d){return d.data()});EMPLOADED=true;render()},function(e){EMPLOADED=true;EMPERR="Не удалось загрузить отчёт"+(e&&e.code?" ("+e.code+")":"");render()})}
function rowOf(r,me){return(r.rows||[]).filter(function(x){return x.n===me})[0]}
function renderEmp(){
var h='<h1>РАЗДАЧА ЗП<small>отчёт</small></h1>',me=getMe();
if(!EMPLOADED)h+='<div class="card"><p class="mut" style="margin:0">Загрузка…</p></div>';
else if(EMPERR)h+='<div class="card"><p class="w" style="margin:0">'+esc(EMPERR)+"</p></div>";
else if(!REPS.length)h+='<div class="card"><p class="mut" style="margin:0">Отчётов пока нет. После закрытия смены здесь появится ваша сумма.</p></div>';
else{
var names=[];REPS.forEach(function(r){(r.rows||[]).forEach(function(w){if(names.indexOf(w.n)<0)names.push(w.n)})});names.sort();
if(!me||names.indexOf(me)<0){h+='<div class="lbl">ВЫБЕРИТЕ СВОЁ ИМЯ</div><div class="card" style="display:flex;flex-wrap:wrap;gap:8px">'+names.map(function(n){return'<button class="pill" data-me="'+esc(n)+'">'+esc(n)+"</button>"}).join("")+"</div>"}
else{
var tot=0,w0=rowOf(REPS[0],me);
REPS.forEach(function(r){var w=rowOf(r,me);if(w)tot+=w.laid});
h+='<div class="lbl">'+esc(me).toUpperCase()+'</div><div class="card"><div class="mut">Смена '+dstr(REPS[0].ts)+"</div>"+(w0?'<div style="font:800 44px ui-monospace,Menlo,Consolas,monospace;color:var(--ac);margin:6px 0">'+fmt(w0.A)+' ₽</div><div>'+(w0.laid===w0.A?"✓ Выдано":"Выдача пока не отмечена")+"</div>"+(w0.raw!==w0.A?'<div class="mut" style="margin-top:6px">По ведомости '+fmt(w0.raw)+" ₽, округлено вниз до 100</div>":""):'<p style="margin:6px 0 0">В этой смене вас нет.</p>')+"</div>";
if(REPS.length>1){h+='<div class="lbl">ПРОШЛЫЕ СМЕНЫ</div><div class="card">';REPS.slice(1).forEach(function(r){var w=rowOf(r,me);h+='<div class="r2"><span>'+dstr(r.ts)+"</span><b>"+(w?fmt(w.A)+" ₽":"—")+"</b></div>"});h+="</div>"}
h+='<div class="card"><div class="r2"><span class="mut">Выдано за последние смены ('+REPS.length+')</span><b>'+fmt(tot)+' ₽</b></div></div><div style="margin:12px 4px"><button class="pill g2" id="chg">Сменить имя</button></div>'}}
var a=document.getElementById("app");a.innerHTML=h;
a.querySelectorAll("button[data-me]").forEach(function(b){b.onclick=function(){setMe(b.getAttribute("data-me"));render()}});
var c=document.getElementById("chg");if(c)c.onclick=function(){setMe("");render()}}
function publishReport(rec){
if(!DBH){NOTE2="Облака нет, отчёт сотрудникам не отправлен.";render();return}
DBH.doc("reports/"+rec.ts).set({ts:rec.ts,rows:rec.rows.map(function(w){return{n:w.n,raw:w.raw,A:w.A,laid:w.laid}})}).then(function(){NOTE2="Отчёт опубликован для сотрудников.";render()},function(e){NOTE2="Отчёт сотрудникам не отправлен"+(e&&e.code?" ("+e.code+")":"");render()})}
function renderOwner(){
var h='<h1>РАЗДАЧА ЗП<small>смена</small></h1><div class="mut" id="cloud" style="margin:-8px 10px 6px">'+CLOUD+'</div>',t=C.tab;
if(t==="shift")h+=viewShift();else if(t==="people")h+=viewPeople();else if(t==="rep")h+=viewRep();else{var R=calc();h+=t==="tab"?viewTab(R):viewSum(R)}
document.getElementById("app").innerHTML=h+nav();bind()}
function viewPeople(){
var h='<div class="lbl">БАНК</div><div class="card"><div class="g"><label>Банк, ₽ ((кг + кмч + салат) × 500)<input id="bank" type="text" readonly value="'+fmt(bankAuto())+'"></label><label>1к в банке, шт.<input id="n1" type="text" inputmode="numeric" value="'+esc(C.n1)+'"></label><label>500 в банке, шт.<input id="n05" type="text" inputmode="numeric" value="'+esc(C.n05)+'"></label><label>Разменять 5к → 1к, шт.<input id="sw" type="text" inputmode="numeric" value="'+esc(C.sw)+'"></label><label style="grid-column:1/3">Бригадиру, ₽ (пусто = авто)<input id="brig" type="text" inputmode="numeric" value="'+esc(C.brig)+'"></label></div></div><div class="lbl">СОТРУДНИКИ</div>';
C.people.forEach(function(p,i){h+='<div class="card pr"><span class="n">'+esc(p.n)+(autoOf(p)?'<small style="display:block;font-weight:400;font-size:12px;color:var(--mut)">'+esc(subOf(p))+'</small>':'')+'</span><input data-a="'+i+'" type="text" inputmode="numeric" placeholder="'+(autoOf(p)||"сумма")+'" value="'+esc(p.a)+'"><span class="rub">₽</span></div>'});
h+='<div style="margin:16px 4px"><button class="pill g2" id="clr">'+(armed==="clr"?"Точно? Нажмите ещё раз":"Очистить суммы, банк, катера, этапы и салат")+'</button></div><p class="mut" style="margin:0 8px">Серая сумма считается сама: (кг + кмч по этапам) × ставка + салат × тариф салата, вниз до 100. Впишите свою, чтобы заменить. Ставки задаются на вкладке «Смена». Пустая сумма означает, что человека в этой смене нет.</p>';return h}
function viewTab(R){
if(!R.W.length)return'<div class="card"><p class="mut">Нет сумм. Введите их на вкладке «Люди».</p></div>';
var sig=JSON.stringify([R.W.map(function(w){return[w.n,w.A]}),R.st]);if(C.sig!==sig){C.ticks={};C.sig=sig;saveLocal()}
var use5=R.T[500]>0||R.st[500]>0,cols=D.filter(function(d){return d!==500||use5});
var laid={5000:0,1000:0,500:0,200:0,100:0},tot=0,rows="";
R.W.forEach(function(w,i){var ls=0;rows+='<tr><td class="nm" data-i="'+i+'">'+esc(w.n)+"<small>"+fmt(w.A)+(w.raw!==w.A?" (было "+fmt(w.raw)+")":"")+"</small></td>";
cols.forEach(function(d){var c=w.c[d];if(!c){rows+='<td class="z">·</td>';return}var k=i+"|"+d,dn=C.ticks[k];if(dn){ls+=c*d;laid[d]+=c}rows+='<td class="cl'+(dn?" d":"")+'" data-k="'+k+'">'+c+"</td>"});

function laidOf(R,i){var w=R.W[i],s=0;D.forEach(function(d){if(w.c[d]&&C.ticks[i+"|"+d])s+=w.c[d]*d});return s}

function notesView(){var h="";

function viewSum(R){
var h=notesView();

else{

var lbl=armed==="close"?(tot===R.S?"Точно? Нажмите ещё раз":"Выдано не всё ("+fmt(tot)+" из "+fmt(R.S)+"). Закрыть? Нажмите ещё раз"):"Закрыть смену и выгрузить таблицу";

h+='<div class="card s">';
R.E.forEach(function(e){h+='<p class="w">'+esc(e)+"</p>"});

var lv=5000*R.L[5000]+1000*R.L[1000]+500*R.L[500];
h+="<p><b>После раздачи на складе:</b> "+txt(R.L)+" = "+fmt(lv)+" ₽.</p>";
var sp=split(R.L,R.B);
if(sp){var bc={5000:sp.a,1000:sp.b,500:sp.c},mc={5000:R.L[5000]-sp.a,1000:R.L[1000]-sp.b,500:R.L[500]-sp.c};h+="<p>Бригадиру: "+txt(bc)+".<br>Вам: "+txt(mc)+" = "+fmt(lv-R.B)+" ₽ (ваши "+fmt(R.M)+" + комиссия "+fmt(R.Cm)+").</p>"}
else if(lv!==R.B+R.Cm+R.M)h+='<p class="w">Остаток на складе не сходится с суммами. Проверьте числа.</p>';
h+="</div>"}
if(!window.claude)h+='<div class="lbl">ТАБЛИЦА GOOGLE</div><div class="card"><label>Ссылка Apps Script<input id="gsurl" type="text" placeholder="https://script.google.com/macros/s/.../exec" value="'+esc(C.gs||"")+'" style="text-align:left;font:14px ui-monospace,Menlo,Consolas,monospace"></label></div>';
var H=hist();
if(H.length){h+='<div class="lbl">ЗАКРЫТЫЕ СМЕНЫ</div><div class="card">';H.slice(0,10).forEach(function(r,i){h+='<div class="r2"><div><b>'+ddate(r)+'</b><div class="mut">ЗП '+fmt(r.S)+" ₽ · "+r.rows.length+' чел.'+(r.boats&&r.boats.length?' · '+fmtk(r.boats.reduce(function(s,x){return s+x.kg},0))+' кг':'')+' · комиссия '+fmt(r.Cm)+' ₽</div></div><span style="display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:58%"><button class="pill g2" data-e="'+i+'" style="padding:10px 14px">CSV</button>'+(inSheet(r)?'<span class="mut" style="margin-left:6px">✓ в таблице</span>':'<button class="pill g2" data-g="'+i+'" style="padding:10px 14px;margin-left:6px">В таблицу</button>')+'<button class="pill g2" data-d="'+i+'" style="padding:10px 14px">✕</button></span></div>'});h+="</div>"}
return h}
function rISO(r){return/^\d{4}-\d{2}-\d{2}$/.test(r.date||"")?r.date:ymd(r.ts)}
function viewRep(){
var d=C.rdate||todayISO(),H=hist(),L=H.filter(function(r){return rISO(r)===d}),ds=[];
H.forEach(function(r){var x=rISO(r);if(ds.indexOf(x)<0)ds.push(x)});

if(ds.length)h+='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">'+ds.slice(0,14).map(function(x){return'<button class="chip'+(x===d?" on":"")+'" data-rd="'+x+'" style="padding:7px 11px;font-size:14px">'+x.slice(8)+"."+x.slice(5,7)+"</button>"}).join("")+"</div>";
h+="</div>";
if(!L.length)return h+'<div class="card"><p class="mut" style="margin:0">За '+esc(ddate({date:d}))+' закрытых смен нет. Отчёт появляется после «Закрыть смену» на вкладке «Итог».</p></div>';
L.forEach(function(r){h+=repView(r,H.indexOf(r),L.length>1)});return h}
function repView(r,i,many){

h+='<tr class="t"><td>Итого</td><td>'+fmtk(n2(k))+"</td><td>"+fmtk(n2(m))+"</td><td>"+fmtk(n2(sl))+"</td><td>"+fmt(sr)+"</td><td>"+fmt(sa)+"</td></tr></tbody></table></div></div>";

h+='<tr class="t"><td>Всего</td><td></td><td>'+fmtk(n2(bk))+"</td><td>"+fmtk(n2(bm))+"</td></tr></tbody></table></div></div>"}
if(S.length){var tk=0,ts=0;h+='<div class="card"><div class="wrap"><table class="rt"><thead><tr><th>Салат</th><th>Кг</th><th>Тариф</th><th>Сумма</th></tr></thead><tbody>';
S.forEach(function(x){tk+=x.kg;ts+=x.sum;h+="<tr><td>"+esc(x.n)+"</td><td>"+fmtk(x.kg)+"</td><td>"+x.r+"</td><td>"+fmt(x.sum)+"</td></tr>"});
h+='<tr class="t"><td>Всего</td><td>'+fmtk(n2(tk))+"</td><td></td><td>"+fmt(ts)+"</td></tr></tbody></table></div></div>"}
h+='<div class="card">'+[["Банк",r.bank],["ЗП всего",r.S],["Остаток банка",r.rest],["Бригадиру",r.B],["Комиссия",r.Cm]].map(function(x){return'<div class="r2"><span class="mut">'+x[0]+"</span><b>"+fmt(x[1]||0)+" ₽</b></div>"}).join("");
h+='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px"><button class="pill g2" data-e="'+i+'">Скачать CSV</button>'+(inSheet(r)?'<span class="mut" style="align-self:center">✓ в Google таблице</span>':'<button class="pill g2" data-g="'+i+'">В Google таблицу</button>')+"</div></div>";
return h}
function bind(){
var a=document.getElementById("app");
a.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){C.tab=b.getAttribute("data-t");armed="";NOTE="";NOTE2="";NOTE3="";CSVTXT="";save();render();window.scrollTo(0,0)}});

a.querySelectorAll("button[data-xb]").forEach(function(b){b.onclick=function(){var i=b.getAttribute("data-xb");if(armed!=="xb"+i){armed="xb"+i;b.textContent="Удалить?";return}boats().splice(+i,1);armed="";save();render()}});
a.querySelectorAll("input[data-sb]").forEach(function(e){e.oninput=function(){stages()[+e.getAttribute("data-sb")].b=e.value;save()}});
a.querySelectorAll("input[data-ss]").forEach(function(e){e.oninput=function(){stages()[+e.getAttribute("data-ss")].s=e.value;save()}});
a.querySelectorAll("input[data-sk]").forEach(function(e){e.oninput=function(){stages()[+e.getAttribute("data-sk")].k=e.value;refreshShift();save()}});
a.querySelectorAll("button[data-sc]").forEach(function(b){b.onclick=function(){var st=stages()[+b.getAttribute("data-sc")],n=C.people[+b.getAttribute("data-pj")].n;st.p=st.p||{};st.p[n]=!st.p[n];armed="";save();render()}});

a.querySelectorAll("button[data-xp]").forEach(function(b){b.onclick=function(){var i=+b.getAttribute("data-xp");if(armed!=="xp"+i){armed="xp"+i;b.textContent="Удалить?";return}var n=C.people[i].n;C.people.splice(i,1);stages().forEach(function(st){if(st.p)delete st.p[n]});armed="";save();render()}});

a.querySelectorAll("button[data-rd]").forEach(function(b){b.onclick=function(){C.rdate=b.getAttribute("data-rd");save();render()}});
a.querySelectorAll("input[data-bm]").forEach(function(e){e.oninput=function(){boats()[+e.getAttribute("data-bm")].m=e.value;refreshShift();save()}});
a.querySelectorAll("input[data-sm]").forEach(function(e){e.oninput=function(){stages()[+e.getAttribute("data-sm")].m=e.value;refreshShift();save()}});
a.querySelectorAll("input[data-ln]").forEach(function(e){var x=salad()[+e.getAttribute("data-ln")];e.oninput=function(){x.n=e.value;refreshShift();save()};e.onchange=function(){var v=e.value.trim();x.n=v;if(v&&!C.people.some(function(p){return p.n===v})){C.people.push({n:v,a:""});save();render();return}save()}});
